
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Diary | Letter.To</title>
    <link rel="stylesheet" href="diary.css">
</head>

<body>
    <main class="cafe-scene">
        <img src="cafeimg.jpeg" class="cafe-image" alt="Brown themed cafe">

        <div class="start-overlay" id="startOverlay">
            <button
                class="play-button"
                onclick="startExperience()"
                aria-label="Start cafe"
            >
                ▶
            </button>
        </div>

        <div class="coffee-steam">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="lamp-glow"></div>

        <button class="sound-button" onclick="toggleSoundPanel()">
            ♫
        </button>

        <div class="sound-panel" id="soundPanel">
            <h3>Sounds</h3>

            <label>
                Café
                <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.5"
                    oninput="changeVolume('cafe', this.value)"
                >
            </label>

            <label>
                Rain
                <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.3"
                    oninput="changeVolume('rain', this.value)"
                >
            </label>

            <label>
                Coffee
                <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.3"
                    oninput="changeVolume('coffee', this.value)"
                >
            </label>
        </div>

        <button
            class="diary-hotspot"
            onclick="openDiary()"
            aria-label="Open diary"
        >
            <span class="diary-glow"></span>
        </button>

        <section class="diary-page" id="diaryPage">
            <div class="paper">
                <div class="paper-top">
                    <input type="date" id="diaryDate">
                </div>

                <div class="paper-content">
                    <textarea
                        id="diaryText"
                        placeholder="Write your thoughts here..."
                    ></textarea>

                    <div class="paper-buttons">
                        <button onclick="saveDiary()">
                            Save
                        </button>

                        <button onclick="exitDiary()">
                            Exit
                        </button>

                        <button class="archive-button">
                            Archive
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <audio id="cafeSound" loop>
        <source src="cafenoise.mp4" type="audio/mpeg">
    </audio>

    <audio id="rainSound" loop>
        <source src="rain.mp3" type="audio/mpeg">
    </audio>

    <audio id="coffeeSound" loop>
        <source src="coffeemaking.mp3" type="audio/mpeg">
    </audio>

    <script src="diary.js"></script>
</body>
</html>
